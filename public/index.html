<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Mini Web Chat</title>

  <!-- Bootstrap CSS -->
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css">
  <!-- jQuery + Bootstrap Bundle -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.bundle.min.js"></script>

  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>

<body style="background-color: #f8fafc;">
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="row w-100 justify-content-center">

      <!-- Khung chat -->
      <div class="col-md-8 col-lg-7">
        <div class="card shadow-lg border-0 rounded-3">
          <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h4 class="card-title mb-0"><i class="fas fa-comments text-primary"></i> Mini Web Chat</h4>
            <select id="room-select" class="form-control form-control-sm w-auto">
              <option value="general">Phòng chung</option>
              <option value="laptrinh">Phòng Lập trình</option>
              <option value="giaitri">Phòng Giải trí</option>
            </select>
          </div>

          <div id="chat-content" class="p-3" style="height:450px; overflow-y:auto; background:#ffffff;">
            <!-- Tin nhắn sẽ hiển thị ở đây -->
          </div>

          <div class="card-footer d-flex align-items-center bg-light">
            <img class="avatar avatar-xs mr-2" src="https://img.icons8.com/color/36/000000/administrator-male.png">
            <input id="message-input" class="form-control border-0 flex-grow-1" type="text" placeholder="Nhập tin nhắn...">
            <button id="send-btn" class="btn btn-link text-info"><i class="fa fa-paper-plane fa-lg"></i></button>
          </div>
        </div>
      </div>

      <!-- Người online -->
      <div class="col-md-3 mt-3 mt-md-0">
        <div class="card shadow-sm border-0 rounded-3">
          <div class="card-header bg-primary text-white text-center">
            <i class="fas fa-users"></i> Người đang online
          </div>
          <ul id="user-list" class="list-group list-group-flush" style="min-height: 200px;">
            <!-- Danh sách online -->
          </ul>
        </div>
      </div>

    </div>
  </div>

  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>
</html>
