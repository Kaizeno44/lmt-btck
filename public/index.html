<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Mini Web Chat</title>

  <!-- Bootstrap + FontAwesome -->
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css">
  <link rel="stylesheet" href="style.css">

  <!-- jQuery + Bootstrap JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.bundle.min.js"></script>

  <!-- Socket.io -->
  <script src="/socket.io/socket.io.js"></script>
</head>

<body>
  <div class="container py-4">
    <div class="row justify-content-center">

      <!-- Khung chat -->
      <div class="col-md-8 col-lg-7 mb-3">
        <div class="card chat-card shadow-sm">
          <div class="card-header d-flex justify-content-between align-items-center bg-white border-bottom">
            <h5 class="mb-0 text-primary"><i class="fas fa-comments"></i> Mini Web Chat</h5>
            <div class="d-flex align-items-center">
              <select id="room-select" class="form-control form-control-sm mr-2">
                <option value="general">Phòng chung</option>
                <option value="laptrinh">Phòng Lập trình</option>
                <option value="giaitri">Phòng Giải trí</option>
              </select>
              <button id="logout-btn" class="btn btn-sm btn-outline-danger">Đăng xuất</button>
            </div>
          </div>

          <div id="chat-content" class="card-body chat-body">
            <!-- Tin nhắn -->
          </div>

          <div class="card-footer bg-light d-flex align-items-center">
            <img class="avatar mr-2" src="https://img.icons8.com/color/36/000000/administrator-male.png">
            <input id="message-input" type="text" class="form-control border-0" placeholder="Nhập tin nhắn...">
            <button id="send-btn" class="btn btn-link text-info"><i class="fa fa-paper-plane fa-lg"></i></button>
          </div>
        </div>
      </div>

      <!-- Người online -->
      <div class="col-md-3">
        <div class="card shadow-sm online-card">
          <div class="card-header bg-primary text-white text-center py-2">
            <i class="fas fa-users"></i> Người đang online
          </div>
          <ul id="user-list" class="list-group list-group-flush">
            <!-- Danh sách online -->
          </ul>
        </div>
      </div>

    </div>
  </div>

  <!-- JS -->
  <script>
    const token = sessionStorage.getItem('token');
    const username = sessionStorage.getItem('username');

    if (!token || !username) {
      window.location.href = '/login.html';
    }

    const socket = io({ auth: { token } });
    let currentRoom = document.getElementById('room-select').value;

    socket.on('connect', () => {
      socket.emit('join room', { room: currentRoom });
    });

    socket.on('chat message', ({ username, message }) => {
      const div = document.createElement('div');
      div.innerHTML = `<strong>${username}:</strong> ${message}`;
      document.getElementById('chat-content').appendChild(div);
      document.getElementById('chat-content').scrollTop = document.getElementById('chat-content').scrollHeight;
    });

    socket.on('chat history', (messages) => {
      const chat = document.getElementById('chat-content');
      chat.innerHTML = '';
      messages.forEach(m => {
        const div = document.createElement('div');
        div.innerHTML = `<strong>${m.username}:</strong> ${m.message}`;
        chat.appendChild(div);
      });
    });

    socket.on('user list', (users) => {
      const userList = document.getElementById('user-list');
      userList.innerHTML = '';
      users.forEach(u => {
        const li = document.createElement('li');
        li.className = 'list-group-item';
        li.textContent = u;
        userList.appendChild(li);
      });
    });

    document.getElementById('send-btn').addEventListener('click', () => {
      const msg = document.getElementById('message-input').value.trim();
      if (!msg) return;
      socket.emit('chat message', { message: msg, room: currentRoom });
      document.getElementById('message-input').value = '';
    });

    document.getElementById('room-select').addEventListener('change', () => {
      socket.emit('leave room', { room: currentRoom });
      currentRoom = document.getElementById('room-select').value;
      socket.emit('join room', { room: currentRoom });
      document.getElementById('chat-content').innerHTML = '';
    });

    window.addEventListener('beforeunload', () => {
      socket.emit('leave room', { room: currentRoom });
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      sessionStorage.clear();
      socket.emit('leave room', { room: currentRoom });
      window.location.href = '/login.html';
    });
  </script>
</body>
</html>
